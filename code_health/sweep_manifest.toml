# The sweep manifest of the map of maps, issue #404. One row per file, for every tracked `.jl`
# file under `src/` and `ext/`.
#
#   map    the child map of #404 that owns the file. `[map]` below names the thirteen.
#   units  the file's count of documented units. `test/test_45_sweep_census.jl` holds the
#          definition and the three checks that read this file.
#   swept  whether the file has passed the first three conditions of its child map's sweep: its
#          documentation states the mathematics, its code agrees with that statement, and its
#          lines are covered or exempted. The fourth condition, that its prose passes `/unslop`,
#          is carried by the file's sweep ticket and moves this flag neither way. The flag arms
#          the gates of the docstring standard, so a swept file keeps it while its prose is
#          re-read.
#
# A row whose `swept` is true carries two more keys:
#
#   algorithm  the count of the file's docstrings that carry a `# Algorithm` section.
#              `test/test_26_docs.jl` holds it as a floor: the measured count may not fall
#              below it. The session that flips `swept` writes the count in the same edit.
#   bindings   the name of the binding each documented unit attaches to, sorted, one entry
#              per unit, so a function with three documented methods is listed three times.
#              It is the record of the text the sweep passed. `test/test_45_sweep_census.jl`
#              compares it against the file: a unit REPLACED one for one leaves `units`
#              where it was, and only the names see it (issue #1065). The session that flips
#              `swept` writes the list in the same edit. A session that changes the unit set
#              of a swept file records the new list and sweeps the new units in the same
#              commit, so it owes no sub-issue. If it cannot, it sets `swept = false`, and
#              the change joins the child map as an addition would (ADR 0148).
#
# #404's standing rule is: any addition joins its child map, and a closed child map -- and the
# umbrella -- is reopened. `CLAUDE.md`, section "Functionality you add", states the steps a person
# takes. A Julia test cannot read the state of an issue, so the census makes the
# omission impossible to miss instead. It fails when a file has no row, when a row names no file,
# when a file's unit count no longer matches its row, and when a swept file's unit names no
# longer match its row.
#
# There is no refresh script, and that is deliberate. ADR 0073 splits the four code-health files on
# authorship because a refresh rewrites a whole generated file, so no human paragraph may share
# one. This file has no refresh: the census prints the corrected line and a human applies it. So
# the measured `units` and the hand-set `map` and `swept` share one line safely.
#
# The row set is total in the sense of ADR 0074, and a rename passes silently by the same
# trade-off that ADR already accepts.

