# --- coverage exemptions ---------------------------------------------------
#
# ADR 0082. One row per definition that holds an uncovered line no test can reach, keyed
# (path, definition) and carrying the exact count of lines it stands for.
#
#   [[coverage_exemption]]
#   path       = "src/…/…jl"
#   definition = "show"          # or "<toplevel>" for a line inside no named definition
#   misses     = 3
#   rationale  = "a-named-rationale-block-above"
#
# The key holds no line number. A line number churns on every insertion above it and on every
# reformat, and this repository formats the whole tree in place, so a line-keyed row would be wrong
# more often than it was right. A definition name survives both. ADR 0071 keys a Dismissal on
# (file, kind, message) for the same reason.
#
# The count is part of the claim, and `coverage.jl check` holds it to equality in both directions.
# A claim above the truth is a stale row whose lines were covered. A claim below it is the leak the
# file total cannot see: a line covered elsewhere in the file pays for a new uncovered line inside
# the exempted definition, and the ratchet reads a flat number.
#
# A row here never moves a baseline number. Like the Exemptions above it, it binds one thing only:
# whether the file is **terminal**, which is #404's condition for closing a child map on coverage.
# The ratchet still sees every miss.
#
# #408 built the machinery; the thirteen child maps of #404 write the rows as they sweep. A row is
# written when a line cannot be reached, never when reaching it is merely awkward.
#
# A line reached only by its own `jldoctest` is not exempt. Coverage is the test suite's number:
# the `doctest` job of `Docs.yml` carries no instrumentation, and a doctest asserts a rendering
# rather than a result. "The doctest reaches it" is therefore not a rationale, and the sweep writes
# the test. ADR 0082, issue #411.

[[coverage_exemption]]
path = "src/11_Phylogeny/03_Hierarchical.jl"
definition = "optimal_number_clusters"
misses = 1
rationale = "a-cut-into-one-cluster-is-always-valid"

[[coverage_exemption]]
path = "src/12_ConstraintGeneration/02_LinearConstraintGeneration.jl"
definition = "LinearConstraint"
misses = 1
rationale = "a-signature-line-counter-the-test-job-cannot-reach"

# The definition is `feature_target!`'s fallback method. The key names every `feature_target!`
# method in the file, and the count of 1 is their sum. This row was keyed `Nothing` until issue
# #521 was fixed, because `defname` named a definition that declares a return type after the return
# type. Only the key changed.
[[coverage_exemption]]
path = "src/12_ConstraintGeneration/06_AssetSetsMatrix.jl"
definition = "feature_target!"
misses = 1
rationale = "a-return-after-an-unconditional-throw"

# Two constants of one shape, one row each. The `const` line of each holds the `map` closure that
