# Cited academic hosts are intermittently slow from CI runners — ijcai.org tripped the default
# timeout twice in one run while answering in under a second from a developer machine. Retry
# before failing the build, so a slow host cannot turn the branch red on its own.
timeout = 45
max_retries = 3
retry_wait_time = 2

# A host that throttles an automated client answers 429 or 503. juliastats.org answered 503
# to one run and 200 to the sibling run of the same commit. Accept the two throttle codes, so
# a momentary refusal cannot turn the branch red. A dead link answers 404, which stays fatal.
accept = ["200..=299", "429", "503"]

exclude = [
  "@ref",
  "@cite",
  "^https://github.com/.*/releases/tag/v.*$",
  "^https://doi.org/FIXME$",
  "^https://dcelisgarza.github.io/PortfolioOptimisers.jl/stable$",
  "zenodo.org/badge/DOI/FIXME$",
  # ACM resolves 10.1145 DOIs to dl.acm.org, which answers 403 to automated clients.
  "^https://doi.org/10.1145/"
]

exclude_path = [
  "docs/build"
]
