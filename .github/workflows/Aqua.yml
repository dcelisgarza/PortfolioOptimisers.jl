name: Aqua

on:
  push:
    branches:
      - main
      - dev*
      - agents/**
    tags: ["*"]
  workflow_dispatch:
  pull_request:

# Aqua only checks out the tree and runs the checks. It writes nothing.
permissions:
  contents: read

jobs:
  build:
    # The name carries the event, so the ruleset of `main` can require the push check by a name that
    # a skipped pull-request run never carries. ADR 0220.
    name: Aqua - ${{ github.event_name }}
    # A pull request from `dev*` or `agents/**` in this repository skips this job. The push to that
    # branch runs it, and its check shows on the head commit of the pull request. ADR 0220.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !((startsWith(github.head_ref, 'dev') && !contains(github.head_ref, '/')) || startsWith(github.head_ref, 'agents/'))
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - uses: actions/checkout@v7
      - name: Aqua
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name="Aqua"))
          Pkg.develop(PackageSpec(path=pwd()))
          using PortfolioOptimisers, Aqua
          Aqua.test_ambiguities(PortfolioOptimisers)
          Aqua.test_unbound_args(PortfolioOptimisers)
          Aqua.test_undefined_exports(PortfolioOptimisers)
          Aqua.test_project_extras(PortfolioOptimisers)
          Aqua.test_stale_deps(PortfolioOptimisers)
          Aqua.test_piracies(PortfolioOptimisers)
          Aqua.test_persistent_tasks(PortfolioOptimisers)
          Aqua.test_deps_compat(PortfolioOptimisers)
