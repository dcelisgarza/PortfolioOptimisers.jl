name: Reusable test

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "1"
      os:
        required: false
        type: string
        default: ubuntu-latest
      arch:
        required: false
        type: string
        default: x64
      allow_failure:
        required: false
        type: boolean
        default: false
      run_codecov:
        required: false
        type: boolean
        default: false
    secrets:
      codecov_token:
        required: true

# Build, test, and upload coverage under `codecov_token`. None of that needs the job token to
# write. A called workflow can only lower the caller's scopes, so this block binds both callers.
permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow_failure }}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ inputs.version }}
          arch: ${{ inputs.arch }}
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.run_codecov }}
      - uses: codecov/codecov-action@v7
        if: ${{ inputs.run_codecov }}
        with:
          file: lcov.info
          token: ${{ secrets.codecov_token }}
      # The coverage ratchet runs in `Coverage.yml`, under the Julia the code-health gate pins,
      # which is not the Julia this job floats on. Handing the file over as an artifact keeps both
      # pins intact: this job stays a build-and-test job, and the gate stays on ADR 0077's version.
      # It also keeps the two verdicts apart, so a ratchet that trips leaves this workflow green.
      # `Coverage.yml` reads this artifact by name, so a rename there is a rename here.
      - name: Publish lcov.info for the ratchet
        if: ${{ inputs.run_codecov }}
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
