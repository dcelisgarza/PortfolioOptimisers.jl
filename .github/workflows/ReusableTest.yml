name: Reusable test

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "1"
      os:
        required: false
        type: string
        default: ubuntu-latest
      arch:
        required: false
        type: string
        default: x64
      allow_failure:
        required: false
        type: boolean
        default: false
      run_codecov:
        required: false
        type: boolean
        default: false
    secrets:
      codecov_token:
        required: true

# Build, test, upload coverage under `codecov_token`, and run the coverage ratchet. None of that
# needs the job token to write, and the ratchet reads an artifact of its own run, so it needs no
# `actions: read` either. A called workflow can only lower the caller's scopes, so this block binds
# both callers.
permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow_failure }}
    # The `coverage` job reads this output, so it runs when the suite is red too. A red suite hid
    # the ratchet from 2026-10-27 to 2026-10-30, while the misses rose (#1912).
    outputs:
      lcov: ${{ steps.publish_lcov.outcome }}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ inputs.version }}
          arch: ${{ inputs.arch }}
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        id: runtest
      # A red suite still writes its `.cov` files, so the ratchet still reads them. A step that the
      # build skipped wrote none, so the two steps below wait for the tests to run. Codecov reads a
      # green suite alone.
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ !cancelled() && inputs.run_codecov && steps.runtest.outcome != 'skipped' }}
      - uses: codecov/codecov-action@v7
        if: ${{ inputs.run_codecov }}
        with:
          file: lcov.info
          token: ${{ secrets.codecov_token }}
      # The coverage ratchet runs in the `coverage` job below, under the Julia the code-health
      # gate pins, which is not the Julia this job floats on. Handing the file over as an artifact
      # keeps both pins intact: this job stays a build-and-test job, and the gate stays on ADR
      # 0077's version. The `coverage` job reads this artifact by name, so a rename there is a
      # rename here.
      - name: Publish lcov.info for the ratchet
        id: publish_lcov
        if: ${{ !cancelled() && inputs.run_codecov && steps.runtest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  # The line-coverage half of the code-health gate. ADR 0082.
  #
  # It is a job of this workflow rather than a workflow of its own, so it runs wherever the suite
  # runs. A `workflow_run` workflow would fire only for a file that is already on the default
  # branch, which is GitHub's rule, and `main` is current to the last release. That form left the
  # gate silent on `dev` and on every pull request until a release carried it over.
  #
  # The suite's verdict and the coverage verdict are two claims about two things, so they are two
  # checks. A trip turns this job's check, `Coverage ratchet`, red, and it leaves the test check
  # green. From 2026-08-27 to 2026-10-30 the ratchet step carried `continue-on-error: true`, so a
  # trip turned nothing red, and 70 files rose with no reader (#1912, ADR 0082, amendment of
  # 2026-10-30). `test/test_49_coverage_attribution_census.jl` pins the guards of this job.
  coverage:
    name: Coverage ratchet
    needs: test
    # The gate needs the `lcov.info` that the test job publishes, and only the matrix entry that
    # measures coverage publishes one. It runs on a red suite too: a red streak must not hide a
    # rise. A test that stopped early can leave lines uncounted, so the summary says when the
    # suite was red.
    if: ${{ !cancelled() && inputs.run_codecov && needs.test.outputs.lcov == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Checkout comes BEFORE setup-julia, because the Julia version is read out of the checkout.
      # ADR 0077.
      #
      # `coverage.jl` reads the file set with `git ls-files`, so the gate needs a git checkout and
      # an unpacked artifact would not serve. The bare checkout reads the same commit as the test
      # job, which on a pull request is the merge commit. ADR 0075.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the Julia pin from the Manifest
        id: pin
        run: |
          v=$(grep '^julia_version' code_health/Manifest.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "The code-health gate is pinned to Julia $v."
      # The test job floats on the newest release, ADR 0056. The gate holds the pin of
      # `code_health/Manifest.toml`, ADR 0077. The two jobs keep the two pins apart.
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ steps.pin.outputs.version }}
      - name: Instantiate the gate's environment
        run: julia --project=code_health -e 'using Pkg; Pkg.instantiate()'
      - uses: actions/download-artifact@v8
        with:
          name: lcov
          path: coverage_download
      - name: Coverage ratchet
        id: ratchet
        env:
          COVERAGE_LCOV: coverage_download/lcov.info
        run: julia --project=code_health code_health/coverage.jl check
      # A step after a failed step runs only when its guard calls a status function, so each guard
      # below reads `failure()` and the outcome of the ratchet step. A guard without `failure()`
      # never runs here, and one without the outcome also runs when an earlier step failed.
      - name: Report a tripped ratchet
        if: ${{ failure() && steps.ratchet.outcome == 'failure' }}
        env:
          SUITE: ${{ needs.test.result }}
        run: |
          echo "::error::The coverage ratchet tripped. Cover each line that rose, or exempt it (ADR 0082)."
          {
            echo "The coverage ratchet tripped. Read the annotations above for the files that"
            echo "rose. Cover each line, or add a Coverage Exemption (ADR 0082). Commit the"
            echo "Refresh Artifact only for a line that the suite cannot reach."
            if [ "$SUITE" != "success" ]; then
              echo
              echo "The suite was red (\`$SUITE\`). A test that stopped early leaves lines"
              echo "uncounted, so a rise can come from the red test and not from the code."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # A run that trips publishes the Refresh Artifact: the baseline as `refresh --accept-rise`
      # would write it. A contributor drops it in place and commits it with no Julia at all.
      # ADR 0075. From 2026-09-15 to 2026-10-29 the guard read `failure()` alone, under a ratchet
      # step with `continue-on-error`, so no run published the artifact (#1912).
      - name: Publish the Refresh Artifact
        if: ${{ failure() && steps.ratchet.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-refresh
          path: code_health/_refresh/*.toml
          if-no-files-found: ignore
