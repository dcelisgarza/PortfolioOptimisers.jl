name: Docs

on:
  push:
    branches:
      - main
      - dev*
      - agents/**
    tags: ["*"]
  pull_request:
    branches:
      - main
      - dev*
    # A pull request deploys a preview under `previews/PR<number>` only when it carries the label
    # `docs-preview` (#1722). Each preview is a full build of about 0.26 GiB, and GitHub Pages refuses
    # a site above 10 GiB. `labeled` builds the preview when the label is added after the push.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  #
  # Any other label starts a run that skips every job. It takes a group of its own, so it does not
  # cancel the build of the pull request that is in progress. `DocPreviewCleanup.yml` names the
  # group `Docs-<ref>` to cancel a preview build when the pull request closes, so keep that name.
  group: >-
    ${{ github.event.action == 'labeled' && github.event.label.name != 'docs-preview' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    # The name carries the event, so the ruleset of `main` can require the push check by a name that
    # a skipped pull-request run never carries. ADR 0220.
    name: Documentation - ${{ github.event_name }}
    # A pull request from `dev*` or `agents/**` in this repository skips this job unless it carries
    # the label `docs-preview`. The push to that branch builds the docs, but `docs/make.jl` deploys
    # only from `main`, so the pull-request run alone deploys the preview. ADR 0220.
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'docs-preview') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || contains(github.event.pull_request.labels.*.name, 'docs-preview') || !((startsWith(github.head_ref, 'dev') && !contains(github.head_ref, '/')) || startsWith(github.head_ref, 'agents/')))
    runs-on: ubuntu-latest
    # The two jobs need different scopes, so each declares its own. This one deploys: it pushes
    # `gh-pages`, reads the pull request it previews, and reports the preview as a status. These
    # are the three scopes Documenter asks for.
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      # `docs/Project.toml` points PortfolioOptimisers at this checkout through `[sources]`, so
      # `Pkg.instantiate` alone resolves the development version. `Pkg.develop` would rewrite
      # that entry.
      - name: Instantiate environment with development version of the package
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Generate and deploy documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          # `true` only on a pull request with the label. `docs/make.jl` reads it as `push_preview`.
          DOCS_PREVIEW: ${{ contains(github.event.pull_request.labels.*.name, 'docs-preview') }}
          JULIA_PKG_SERVER: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
  doctest:
    # The name carries the event, so the ruleset of `main` can require the push check by a name that
    # a skipped pull-request run never carries. ADR 0220.
    name: Doctests - ${{ github.event_name }}
    # The `docs-preview` label cancels the run of the same commit, doctests included, so run them again.
    # A pull request from `dev*` or `agents/**` in this repository skips this job. The push to that
    # branch runs it, and its check shows on the head commit of the pull request. ADR 0220.
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'docs-preview') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !((startsWith(github.head_ref, 'dev') && !contains(github.head_ref, '/')) || startsWith(github.head_ref, 'agents/')))
    runs-on: ubuntu-latest
    # This job runs `doctest` and deploys nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      # `docs/Project.toml` points PortfolioOptimisers at this checkout through `[sources]`, so
      # `Pkg.instantiate` alone resolves the development version. `Pkg.develop` would rewrite
      # that entry.
      - name: Instantiate environment with development version of the package
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Run doctest
        run: |
          julia --color=yes --project=docs -e '
            using Documenter: DocMeta, doctest
            using PortfolioOptimisers
            PortfolioOptimisers.set_compact_show!(false)
            PortfolioOptimisers.set_show_nothing_fields!(true)
            DocMeta.setdocmeta!(PortfolioOptimisers, :DocTestSetup, :(using PortfolioOptimisers, StatsBase, Statistics, LinearAlgebra, Dates, Distributions, StableRNGs, TimeSeries; PortfolioOptimisers.set_compact_show!(false); PortfolioOptimisers.set_show_nothing_fields!(true)); recursive=true)
            const DOCTEST_FILTERS = [r"(\d\.\d{10})\d+" => s"\1"]
            doctest(PortfolioOptimisers; doctestfilters = DOCTEST_FILTERS)'
        env:
          JULIA_PKG_SERVER: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
