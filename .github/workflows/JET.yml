name: JET

# The JET half of the code-health gate. One `report_package` call costs about six minutes of wall
# time and 2.4 GiB of peak resident memory, and the script makes three calls.
#
# The pull-request trigger carries a `paths:` filter, and the push trigger does not. JET's number
# cannot change unless the source, the load set or the analyser pin changed, so the filter skips the
# run of a docs-only pull request from a fork. ADR 0077.
#
# The push trigger has no filter because the ruleset of `main` requires the check `JET - push` on
# the head of a pull request into `main`. A workflow that a `paths:` filter skips leaves its check
# pending, and a pending required check blocks the merge. ADR 0220, #1832.

on:
  push:
    branches:
      - main
      - dev*
      - agents/**
    tags: ["*"]
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'ext/**'
      - 'code_health/**'
      - 'Project.toml'
      - '.github/workflows/JET.yml'

# The gate only measures. It writes nothing back to the repository, so a fork pull request needs no
# more than this and nothing anywhere tests for a fork. ADR 0075.
permissions:
  contents: read

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  #
  # Five pushes to a pull request in ten minutes would otherwise mean five full JET runs, four of
  # them already obsolete when they finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    # The name carries the event, so the ruleset of `main` can require the push check by a name that
    # a skipped pull-request run never carries. ADR 0220.
    name: JET - ${{ github.event_name }}
    # A pull request from `dev*` or `agents/**` in this repository skips this job. The push to that
    # branch runs it, and its check shows on the head commit of the pull request. ADR 0220.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !((startsWith(github.head_ref, 'dev') && !contains(github.head_ref, '/')) || startsWith(github.head_ref, 'agents/'))
    runs-on: ubuntu-latest
    steps:
      # Checkout comes BEFORE setup-julia, which inverts Aqua.yml's order, because the Julia
      # version is read out of the checkout. The bare checkout measures the merge commit.
      - uses: actions/checkout@v7
      - name: Read the Julia pin from the Manifest
        id: pin
        run: |
          v=$(grep '^julia_version' code_health/Manifest.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "The code-health gate is pinned to Julia $v."
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ steps.pin.outputs.version }}
      - name: Instantiate the gate's environment
        run: julia --project=code_health -e 'using Pkg; Pkg.instantiate()'
      - name: JET baseline
        run: julia --project=code_health code_health/jet.jl check
      # A run that trips publishes the Refresh Artifact. A provenance mismatch writes no file, so
      # `if-no-files-found: ignore` publishes nothing: a poisoned baseline must never sit one
      # download away from a commit. ADR 0075.
      - name: Publish the Refresh Artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jet-refresh
          path: code_health/_refresh/*.toml
          if-no-files-found: ignore
      - name: Measure fresh numbers for a dispatched run
        if: success() && github.event_name == 'workflow_dispatch'
        run: julia --project=code_health code_health/jet.jl refresh
      - name: Publish the fresh numbers
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: jet-fresh
          path: code_health/jet_baseline.toml
