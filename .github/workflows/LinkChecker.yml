name: Link checker

on:
  push:
    branches:
      - main
      - dev*
      - agents/**
    tags: ["*"]
  pull_request:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# Lychee reports through the job status. It opens no issue, so it writes nothing.
permissions:
  contents: read

jobs:

