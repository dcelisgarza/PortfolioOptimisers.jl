name: Doc preview cleanup

on:
  pull_request:
    types: [closed]

# `gh-pages` carries one full documentation build per open pull request, under
# `previews/PR<number>`. Nothing removed them until this workflow, so the branch kept every
# preview it ever built. This job deletes the preview of the pull request that closed.
concurrency:
  # `gh-pages` takes one writer at a time. Two cleanups that run together push over each other,
  # so queue them instead of cancelling them.
  group: doc-preview-cleanup
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    name: Delete the preview of the closed pull request
    runs-on: ubuntu-latest
    # The job rewrites `gh-pages` and pushes it. Write access to the contents is the only scope
    # that it needs.
    permissions:
      contents: write
    steps:
      - name: Checkout the gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Delete the preview and the history, then push
        run: |
          set -euo pipefail
          if [ ! -d "${preview_dir}" ]; then
            echo "No preview at ${preview_dir}. Nothing to delete."
            exit 0
          fi
          git config user.name "Documenter.jl"
          git config user.email "documenter@juliadocs.github.io"
          git rm -rf --quiet "${preview_dir}"
          git commit -m "delete preview ${preview_dir}"
          # A plain delete leaves every preview in the history of the branch, so the repository
          # never gets smaller. Replace the history with one commit that holds the current tree.
          git branch gh-pages-new "$(echo "delete history" | git commit-tree HEAD^{tree})"
          git push --force origin gh-pages-new:gh-pages
        env:
          preview_dir: previews/PR${{ github.event.number }}
