name: Test

on:
  push:
    branches:
      - main
      - dev*
      - agents/**
    tags: ["*"]
  workflow_dispatch:

# The caller sets the ceiling for `ReusableTest.yml`, which only builds and tests.
permissions:
  contents: read

# A push to a `dev-` branch cancels the run of its old head, because a merge reads the new head alone.
# Every other run has a group of its own, so no run of `main`, `dev` or a tag replaces another.
# ADR 0220.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/dev-') && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ReusableTest.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      allow_failure: ${{ matrix.allow_failure }}
      run_codecov: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1"]
        os: [ubuntu-latest]
        # , macOS-latest]
        arch: [x64]
        allow_failure: [false]
