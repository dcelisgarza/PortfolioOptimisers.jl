        #   - version: "pre"
        #     os: ubuntu-latest
        #     arch: x64
        #     allow_failure: true
        #   - version: "pre"
        #     os: macOS-latest
        #     arch: x64
        #     allow_failure: true
        #   - version: "lts"
        #     os: ubuntu-latest
        #     arch: x64
        #     allow_failure: true
